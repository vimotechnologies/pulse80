name: Analytics calculations
on:
  pull_request:
    paths:
      - 'data-analytics/**'
      - 'pulse80-backend/supabase/migrations/**'
      - '.github/workflows/analytics-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-analytics/requirements-test.txt
      - run: python -m pip install -r data-analytics/requirements-test.txt
      - run: python -m pytest data-analytics/tests -v --junitxml=analytics-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-test-results
          path: analytics-test-results.xml
